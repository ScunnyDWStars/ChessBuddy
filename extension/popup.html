<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChessBuddy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icons/icon-48.png" alt="" />
      <h1>Chess<b>Buddy</b></h1>
    </header>

    <button id="review" class="primary" type="button">Review this game</button>
    <p id="status" class="status" role="status"></p>

    <section>
      <h2>Your usernames</h2>
      <p class="hint">Used to review the game from your side.</p>
      <label for="chesscomUser">Chess.com</label>
      <input id="chesscomUser" autocomplete="off" spellcheck="false" placeholder="e.g. ChessManDan1888" />
      <label for="lichessUser">Lichess</label>
      <input id="lichessUser" autocomplete="off" spellcheck="false" placeholder="optional" />
    </section>

    <section>
      <h2>When a game ends</h2>
      <label class="toggle">
        <input id="autoSave" type="checkbox" />
        <span>Save it to ChessBuddy automatically (analysed next time ChessBuddy is open)</span>
      </label>
      <label class="toggle">
        <input id="autoOpen" type="checkbox" />
        <span>Open the review straight away</span>
      </label>
      <p id="queued" class="hint"></p>
    </section>

    <button id="open" class="secondary" type="button">Open ChessBuddy</button>
    <script src="popup.js"></script>
  </body>
</html>
